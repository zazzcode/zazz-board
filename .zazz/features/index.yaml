features:
  - key: rbac
    file: rbac-feature.md
    domain: role-based access control, project membership, permissions
    current_milestone: M1 proposed
    current_state: >
      Zazz Board authenticates users and project-scoped agent tokens, and some
      project settings are project-leader-only, but most collaboration permissions
      are not yet expressed as project-scoped roles.
    purpose: >
      Defines how Zazz Board should evolve from a project-owner-only model to
      project-scoped roles and server-enforced permissions for owners, planners,
      contributors, reviewers, and agents.
  - key: project-milestones
    file: project-milestones-feature.md
    domain: project milestones, Gantt planning, deliverable organization
    current_milestone: M1 planned
    current_state: >
      Zazz Board manages deliverables and tasks, but it does not yet expose a
      durable feature layer, milestone structure, or milestone-scoped grouping
      of deliverables.
    purpose: >
      Defines how Zazz Board should represent long-lived feature context and
      milestone progression without duplicating canonical feature-document
      content that remains in Git-managed framework docs.
